<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%" fx="45%" fy="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#b9c0c8"/>
      <stop offset="100%" stop-color="#7a828b"/>
    </radialGradient>
    <linearGradient id="swirlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8eaf0"/>
      <stop offset="50%" stop-color="#b9c0c8"/>
      <stop offset="100%" stop-color="#7a828b"/>
    </linearGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer orbital ring -->
  <path d="M32 2c16.6 0 30 13.4 30 30s-13.4 30-30 30S2 48.6 2 32 15.4 2 32 2" fill="none" stroke="url(#orbGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Swirling orbital ribbons -->
  <path d="M20 32c0-5.5 3.2-10.3 8-12.6 4.8-2.3 10.5-1.2 14.8 3.6 2.2 2.5 3.4 5.8 3.4 9.3 0 3.5-1.2 6.8-3.4 9.3s-10 5.9-14.8 3.6c-4.8-2.3-8-7.1-8-12.6" fill="none" stroke="url(#swirlGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M44 32c0 5.5-3.2 10.3-8 12.6-4.8 2.3-10.5 1.2-14.8-3.6-2.2-2.5-3.4-5.8-3.4-9.3 0-3.5 1.2-6.8 3.4-9.3s10-5.9 14.8-3.6c4.8 2.3 8 7.1 8 12.6" fill="none" stroke="url(#swirlGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Central star -->
  <path d="M32 21.5l-1.6 3.2-3.9 0.8 1.6 3.2 2.3-2.2 2.3 2.2 1.6-3.2-3.9-0.8z" fill="#fff" filter="url(#starGlow)"/>
  <circle cx="32" cy="32" r="2.2" fill="#fff"/>
</svg>
